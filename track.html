<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b6e99">
  <title>Track your cargo · Naalu</title>
  <link rel="icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="naalu.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="track.js"></script>
  <style>
    .portal { max-width: 560px; margin: 0 auto; padding: 14px 14px 40px; display: flex; flex-direction: column; gap: 12px; }
    .hero { text-align: center; padding: 6px 0 0; }
    .hero img { width: 64px; height: 64px; }
    .hero h1 { margin: 6px 0 2px; font-size: 22px; }
    #map { height: 300px; border-radius: var(--radius); overflow: hidden; background: #dfeef5; }
    .timeline { display: flex; flex-direction: column; gap: 0; }
    .step { display: flex; gap: 12px; align-items: flex-start; position: relative; padding-bottom: 16px; }
    .step:not(:last-child)::after { content: ""; position: absolute; left: 15px; top: 32px; bottom: 0; width: 3px; background: var(--line); }
    .step.done:not(:last-child)::after { background: var(--brand); }
    .dot { width: 32px; height: 32px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--line); font-size: 16px; }
    .step.done .dot { background: var(--brand); color: #fff; }
    .step.now .dot { box-shadow: 0 0 0 5px #0b6e9933; }
    .step b { display: block; }
    .bigstatus { font-size: 24px; font-weight: 800; color: var(--brand-dark); }
    .route { font-size: 18px; font-weight: 700; }
    .due { background: #fff5f5; color: var(--bad); border-radius: 12px; padding: 10px 12px; font-weight: 700; }
    .paidok { background: #ebfbee; color: #2b8a3e; border-radius: 12px; padding: 10px 12px; font-weight: 700; }
    .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 15px; }
    .kv span { color: var(--muted); }
    .err { color: var(--bad); font-weight: 600; text-align: center; min-height: 1.4em; }
    .boat-icon { font-size: 30px; line-height: 30px; text-align: center; filter: drop-shadow(0 2px 2px #0006); }
  </style>
</head>
<body>
  <header class="top"><span>🚤 Naalu · Cargo tracking</span></header>
  <div class="portal">
    <div class="hero">
      <img src="icons/icon.svg" alt="">
      <h1 id="pageTitle">Where is my cargo?</h1>
      <p class="muted" id="pageSub">Enter the receipt number and the last 4 digits of your phone number.</p>
    </div>

    <form id="findForm" class="box stack">
      <input id="fReceipt" placeholder="Receipt no. e.g. N261120-142586" autocomplete="off" autocapitalize="characters" required>
      <input id="fPhone" placeholder="Last 4 digits of your phone" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required>
      <button class="btn primary big">🔍 Track</button>
      <p class="err" id="findErr"></p>
    </form>

    <div id="result" class="stack hidden">
      <div class="box">
        <div class="muted" id="rBoat"></div>
        <div class="bigstatus" id="rStatus"></div>
        <div class="route" id="rRoute"></div>
        <div class="muted" id="rVoyage"></div>
      </div>

      <div class="box">
        <h4>🗺 Boat location</h4>
        <div id="map"></div>
        <div class="muted" id="mapNote"></div>
      </div>

      <div class="box">
        <h4>Progress</h4>
        <div class="timeline" id="timeline"></div>
      </div>

      <div class="box">
        <h4>Details</h4>
        <div class="kv" id="details"></div>
        <div id="payBox"></div>
      </div>

      <div class="row wrap" id="contactBox"></div>
      <button class="btn big" id="againBtn">Track another receipt</button>
    </div>
  </div>
</body>
</html>
